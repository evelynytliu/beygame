<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#050510">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Neon Spinner">
    <title>Neon Spinner: Ultimate Arena</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <script src="js/vendor/three.min.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div id="game-canvas"></div>
    <div id="msg-overlay">READY</div>
    <div id="rating-overlay"></div>

    <!-- ======================= BATTLE HUD ======================= -->
    <div id="hud" class="hidden">
        <div class="hud-side">
            <div class="hud-text you">YOU</div>
            <div class="spin-bar-bg"><div class="spin-bar-fill player" id="spin-bar-p" style="width:100%"></div></div>
            <div class="burst-bar-bg"><div class="burst-bar-fill" id="burst-bar-p" style="width:0%"></div></div>
        </div>
        <div id="battle-timer">0:00</div>
        <div class="hud-side right">
            <div class="hud-text enemy" id="hud-enemy-name">ENEMY</div>
            <div class="spin-bar-bg"><div class="spin-bar-fill enemy" id="spin-bar-e" style="width:100%"></div></div>
            <div class="burst-bar-bg"><div class="burst-bar-fill" id="burst-bar-e" style="width:0%"></div></div>
        </div>
    </div>

    <!-- Boost button -->
    <div id="boost-btn" class="hidden">
        <div class="boost-ring"></div>
        <div class="boost-core">⚡</div>
        <div class="boost-charges" id="boost-charges">●●●</div>
    </div>

    <div id="tilt-indicator">
        <div id="tilt-dot"></div>
        <div id="tilt-stamina-ring"></div>
    </div>

    <!-- ======================= LAUNCH UI ======================= -->
    <div id="launch-overlay" class="hidden">
        <div id="launch-arrow"></div>
        <!-- Power meter -->
        <div id="power-meter">
            <div class="pm-track">
                <div class="pm-sweet"></div>
                <div class="pm-fill" id="pm-fill"></div>
            </div>
            <div class="pm-label">POWER</div>
        </div>
        <div class="launch-tip" id="launch-tip">按住發射器往下拉，末端快速甩開！<br><span class="sub">拉進綠色甜蜜區＋快甩 = PERFECT 發射｜左右拖曳可瞄準</span></div>
        <div id="ripcord-line"></div>
        <div id="launch-handle-zone">
            <div class="ripcord-knob"><div class="ripcord-grip"></div></div>
        </div>
    </div>

    <!-- ======================= SCREENS ======================= -->
    <div id="ui-layer">

        <!-- HOME -->
        <div id="screen-home" class="screen home">
            <div class="logo">
                <div class="logo-top">NEON</div>
                <div class="logo-main">SPINNER</div>
                <div class="logo-sub">ULTIMATE ARENA</div>
            </div>
            <div class="home-stats" id="home-stats"></div>
            <div class="home-buttons">
                <button class="btn big glow" onclick="UI.goLevels()">⚔️ 開始戰鬥</button>
                <button class="btn" onclick="UI.goGarage()">🔧 陀螺工坊</button>
                <button class="btn ghost" onclick="UI.openSettings()">⚙️ 設定</button>
            </div>
            <div class="coin-badge" id="home-coins">🪙 0</div>
        </div>

        <!-- GARAGE -->
        <div id="screen-garage" class="screen garage hidden">
            <div class="garage-head">
                <button class="icon-btn" onclick="UI.goHome()">←</button>
                <h1>陀螺工坊</h1>
                <div class="coin-badge small" id="garage-coins">🪙 0</div>
            </div>

            <div class="tab-bar">
                <div class="tab active" id="tab-parts" onclick="UI.garageTab('parts')">零件</div>
                <div class="tab" id="tab-paint" onclick="UI.garageTab('paint')">塗裝</div>
            </div>

            <!-- Parts tab -->
            <div id="garage-parts">
                <div class="part-section">
                    <div class="part-title">刃盤 BLADE <span class="part-hint">決定攻擊型態與範圍</span></div>
                    <div class="part-row" id="row-blade"></div>
                </div>
                <div class="part-section">
                    <div class="part-title">配重環 WEIGHT <span class="part-hint">決定重量與慣性</span></div>
                    <div class="part-row" id="row-weight"></div>
                </div>
                <div class="part-section">
                    <div class="part-title">軸尖 TIP <span class="part-hint">決定移動方式與續航</span></div>
                    <div class="part-row" id="row-tip"></div>
                </div>

                <div class="stats-panel">
                    <div class="stat-line"><span>攻擊</span><div class="stat-bar"><div id="sb-atk" class="stat-fill atk"></div></div><span class="stat-num" id="sn-atk">0</span></div>
                    <div class="stat-line"><span>防禦</span><div class="stat-bar"><div id="sb-def" class="stat-fill def"></div></div><span class="stat-num" id="sn-def">0</span></div>
                    <div class="stat-line"><span>持久</span><div class="stat-bar"><div id="sb-sta" class="stat-fill sta"></div></div><span class="stat-num" id="sn-sta">0</span></div>
                    <div class="stat-line"><span>速度</span><div class="stat-bar"><div id="sb-spd" class="stat-fill spd"></div></div><span class="stat-num" id="sn-spd">0</span></div>
                    <div class="cp-line">戰鬥力 <span id="garage-cp">0</span></div>
                </div>
            </div>

            <!-- Paint tab -->
            <div id="garage-paint" class="hidden">
                <div class="colors">
                    <div class="color-swatch active" style="background:#00f3ff" onclick="Paint.setColor('#00f3ff', this)"></div>
                    <div class="color-swatch" style="background:#ff0055" onclick="Paint.setColor('#ff0055', this)"></div>
                    <div class="color-swatch" style="background:#ffff00" onclick="Paint.setColor('#ffff00', this)"></div>
                    <div class="color-swatch" style="background:#00ff88" onclick="Paint.setColor('#00ff88', this)"></div>
                    <div class="color-swatch" style="background:#aa66ff" onclick="Paint.setColor('#aa66ff', this)"></div>
                    <div class="color-swatch" style="background:#ffffff" onclick="Paint.setColor('#ffffff', this)"></div>
                </div>
                <div class="tool-bar">
                    <div class="tool-btn active" id="tool-pen" onclick="Paint.setTool('pen')">✏️ 畫筆</div>
                    <div class="tool-btn" id="tool-fill" onclick="Paint.setTool('fill')">🪣 填色</div>
                    <div class="tool-btn" id="tool-eraser" onclick="Paint.setTool('eraser')">🧹 擦除</div>
                    <div class="tool-btn" onclick="Paint.clearCanvas()">❌ 清空</div>
                </div>
                <div class="size-control">
                    <span>粗細</span>
                    <input type="range" min="2" max="40" value="10" oninput="Paint.setBrush(this.value)">
                    <span id="brush-size-val">10</span>
                </div>
                <div class="canvas-container">
                    <canvas id="draw-canvas" width="300" height="300"></canvas>
                </div>
            </div>

            <div class="garage-foot">
                <button class="btn big glow" onclick="UI.goLevels()">⚔️ 出戰</button>
            </div>
        </div>

        <!-- LEVEL SELECT -->
        <div id="screen-levels" class="screen levels hidden">
            <div class="garage-head">
                <button class="icon-btn" onclick="UI.goHome()">←</button>
                <h1>選擇對手</h1>
                <div class="coin-badge small" id="levels-coins">🪙 0</div>
            </div>
            <div class="level-grid" id="level-grid"></div>
            <div class="garage-foot">
                <button class="btn ghost" onclick="UI.goGarage()">🔧 調整陀螺</button>
            </div>
        </div>

        <!-- RESULT -->
        <div id="screen-result" class="screen result hidden">
            <h1 id="result-title">VICTORY</h1>
            <p id="result-sub">結果</p>
            <div class="result-reward" id="result-reward"></div>
            <div class="result-stats" id="result-stats"></div>
            <div class="result-buttons">
                <button class="btn glow" onclick="Battle.retry()">🔄 再次挑戰</button>
                <button class="btn" id="result-next-btn" onclick="Battle.nextLevel()">⏭ 下一關</button>
                <button class="btn ghost" onclick="UI.goGarage()">🔧 工坊</button>
                <button class="btn ghost" onclick="UI.goLevels()">📋 選關</button>
            </div>
        </div>

        <!-- SETTINGS MODAL -->
        <div id="modal-settings" class="modal hidden">
            <div class="modal-box">
                <h2>設定</h2>
                <div class="setting-row"><span>音效</span><div class="toggle on" id="tg-sound" onclick="UI.toggleSetting('sound', this)"></div></div>
                <div class="setting-row"><span>音樂</span><div class="toggle on" id="tg-music" onclick="UI.toggleSetting('music', this)"></div></div>
                <div class="setting-row"><span>震動回饋</span><div class="toggle on" id="tg-haptics" onclick="UI.toggleSetting('haptics', this)"></div></div>
                <div class="setting-row"><span>高畫質特效</span><div class="toggle on" id="tg-fx" onclick="UI.toggleSetting('fx', this)"></div></div>
                <div class="modal-stats" id="settings-stats"></div>
                <button class="btn" onclick="UI.closeSettings()">關閉</button>
            </div>
        </div>

        <!-- TUTORIAL MODAL -->
        <div id="modal-tutorial" class="modal hidden">
            <div class="modal-box">
                <h2 id="tut-title">歡迎來到競技場！</h2>
                <div id="tut-body" class="tut-body"></div>
                <button class="btn glow" id="tut-btn" onclick="UI.tutorialNext()">下一步</button>
            </div>
        </div>
    </div>

    <script src="js/audio.js"></script>
    <script src="js/parts.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
